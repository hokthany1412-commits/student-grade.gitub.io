<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --font-khmer-title: 'Moul', 'Khmer OS Muol Light', cursive, serif;
            --font-khmer-body: 'Battambang', 'Khmer OS Battambang', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-khmer-body);
            background-color: #cbd5e1;
            color: #0f172a;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .moul-font {
            font-family: var(--font-khmer-title);
        }

        /* Top Action Toolbar */
        .action-toolbar {
            background: #ffffff;
            border-bottom: 1px solid #cbd5e1;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .toolbar-left, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            transition: all 0.2s ease;
        }

        .toolbar-btn:hover {
            background: #f8fafc;
            transform: translateY(-1px);
        }

        .toolbar-btn-primary {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
        }
        .toolbar-btn-primary:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            color: #ffffff;
        }

        .toolbar-btn-success {
            background: linear-gradient(135deg, #059669, #047857);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
        }
        .toolbar-btn-success:hover {
            background: linear-gradient(135deg, #047857, #065f46);
            color: #ffffff;
        }

        .toolbar-btn-amber {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.3);
        }
        .toolbar-btn-amber:hover {
            background: linear-gradient(135deg, #b45309, #92400e);
            color: #ffffff;
        }

        .toolbar-btn-purple {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.3);
        }
        .toolbar-btn-purple:hover {
            background: linear-gradient(135deg, #6d28d9, #5b21b6);
            color: #ffffff;
        }

        /* Stats & Filter Bar */
        .info-pill-bar {
            max-width: 210mm;
            margin: 12px auto 6px auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid #cbd5e1;
        }

        .stat-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.86rem;
            font-weight: 700;
            color: #334155;
        }

        .stat-badge {
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 6px;
            color: #0284c7;
            font-size: 0.95rem;
        }

        /* A4 Page Viewport Wrapper */
        .a4-page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 10px 10px 50px 10px;
            box-sizing: border-box;
        }

        /* STRICT OFFICIAL A4 SHEET */
        .a4-sheet {
            width: 210mm !important;
            min-width: 210mm !important;
            max-width: 210mm !important;
            min-height: 297mm !important;
            height: auto !important;
            background: #ffffff !important;
            margin: 0 auto 25px auto !important;
            padding: 12mm 12mm 12mm 12mm !important;
            box-sizing: border-box !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.18) !important;
            position: relative !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-start !important;
            color: #000000 !important;
        }

        .a4-content-top {
            width: 100% !important;
            max-width: 100% !important;
        }

        .a4-content-bottom {
            width: 100% !important;
            margin-top: 6px !important;
        }

        /* Official Header Block */
        .doc-header-block {
            width: 100%;
            margin-bottom: 6px;
        }

        .kingdom-header {
            text-align: center !important;
            margin: 0 auto 6px auto !important;
            width: 100% !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .kingdom-title {
            font-family: var(--font-khmer-title) !important;
            font-size: 11pt !important;
            font-weight: normal !important;
            margin: 0 !important;
            line-height: 1.35 !important;
            color: #000000 !important;
            text-align: center !important;
            display: block !important;
            width: 100% !important;
        }

        .kingdom-motto {
            font-family: var(--font-khmer-title) !important;
            font-size: 10pt !important;
            font-weight: normal !important;
            margin: 2px 0 0 0 !important;
            line-height: 1.35 !important;
            color: #000000 !important;
            text-align: center !important;
            display: block !important;
            width: 100% !important;
        }

        .header-divider-line {
            display: block !important;
            margin: 2px auto 4px auto !important;
            width: 110px !important;
            height: 4px !important;
        }

        .admin-org-left {
            text-align: left;
            margin-bottom: 6px;
            line-height: 1.35;
        }

        .office-name-text {
            font-family: var(--font-khmer-title);
            font-size: 9.5pt;
            font-weight: normal;
            margin: 0;
            color: #000000;
        }

        .school-name-text {
            font-family: var(--font-khmer-title);
            font-size: 9.5pt;
            font-weight: normal;
            margin: 1px 0 0 0;
            color: #000000;
        }

        .main-exam-title-box {
            text-align: center;
            margin-bottom: 8px;
            width: 100%;
        }

        .main-exam-title {
            font-family: var(--font-khmer-title);
            font-size: 11pt;
            font-weight: normal;
            line-height: 1.35;
            margin: 0 0 2px 0;
            color: #000000;
            letter-spacing: 0.1px;
            text-align: center;
        }

        .target-school-sub {
            font-family: var(--font-khmer-title);
            font-size: 9.8pt;
            font-weight: normal;
            line-height: 1.35;
            margin: 0;
            color: #000000;
            text-align: center;
        }

        /* OFFICIAL EXAM TABLE - 100% BOUNDED WITH CRISP BLACK BORDERS */
        .exam-table-wrapper {
            width: 100% !important;
            max-width: 100% !important;
            margin-bottom: 4px !important;
            overflow: hidden !important;
        }

        table.exam-table, .exam-table {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 100% !important;
            table-layout: fixed !important;
            border-collapse: collapse !important;
            font-family: var(--font-khmer-body);
            font-size: 8.5pt;
            color: #000000;
            border: 1.5px solid #000000 !important;
            margin: 0 !important;
        }

        table.exam-table th,
        table.exam-table td {
            border: 1px solid #000000 !important;
            padding: 2px 2px !important;
            vertical-align: middle !important;
            line-height: 1.2 !important;
            box-sizing: border-box !important;
            color: #000000 !important;
            min-width: 0 !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }

        table.exam-table thead th {
            font-family: var(--font-khmer-body) !important;
            font-weight: bold !important;
            font-size: 8.4pt !important;
            text-align: center !important;
            background: #ffffff !important;
            color: #000000 !important;
            padding: 3px 1px !important;
            border: 1px solid #000000 !important;
            border-bottom: 1.5px solid #000000 !important;
            line-height: 1.25 !important;
            white-space: nowrap !important;
            min-width: 0 !important;
        }

        /* Specific Table Cell Alignment */
        .cell-num {
            text-align: center !important;
            font-weight: bold !important;
            font-size: 8.5pt !important;
            white-space: nowrap !important;
        }

        .cell-name {
            text-align: left !important;
            padding-left: 5px !important;
            font-weight: bold !important;
            font-size: 8.6pt !important;
            white-space: nowrap !important;
        }

        .cell-gender {
            text-align: center !important;
            font-size: 8.5pt !important;
            white-space: nowrap !important;
        }

        .cell-dob {
            text-align: center !important;
            font-size: 8.4pt !important;
            white-space: nowrap !important;
        }

        .cell-average {
            text-align: center !important;
            font-weight: bold !important;
            font-size: 8.6pt !important;
            white-space: nowrap !important;
        }

        .cell-school {
            text-align: center !important;
            font-size: 8.4pt !important;
            white-space: nowrap !important;
        }

        .cell-other {
            text-align: center !important;
            font-size: 8.2pt !important;
            white-space: nowrap !important;
        }

        .editable-cell {
            outline: none;
            transition: background 0.15s;
        }
        .editable-cell:hover, .editable-cell:focus {
            background-color: #fef9c3 !important;
            cursor: text;
        }

        /* Summary Line Under Table */
        .summary-stop-line {
            font-family: var(--font-khmer-body);
            font-size: 9pt;
            font-weight: bold;
            color: #000000;
            margin: 4px 0 4px 0;
            line-height: 1.35;
            text-align: left;
        }

        /* Date Lines (Lunar & Solar) */
        .date-section-right {
            text-align: right;
            margin-right: 10px;
            margin-top: 2px;
            margin-bottom: 6px;
            line-height: 1.35;
            font-size: 9pt;
        }

        .lunar-date-text {
            font-weight: normal;
        }

        .solar-date-text {
            font-weight: normal;
        }

        /* 3-Column Signatures Section */
        .signature-section {
            width: 100%;
            margin-top: 4px;
            page-break-inside: avoid;
        }

        .signature-grid-3col {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            text-align: center;
            font-size: 9pt;
            line-height: 1.35;
        }

        .sign-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 95px;
        }

        .sign-header-seen {
            font-weight: bold;
            margin-bottom: 2px;
        }

        .sign-role-title {
            font-weight: bold;
            margin-bottom: 45px;
        }

        .sign-principal-title {
            font-family: var(--font-khmer-title);
            font-size: 9.5pt;
            font-weight: normal;
            margin-bottom: 45px;
            margin-top: 14px;
        }

        .sign-name-space {
            font-family: var(--font-khmer-title);
            font-size: 9pt;
            font-weight: normal;
            margin-top: auto;
        }

        /* Settings Modal */
        .settings-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .settings-modal-card {
            background: #ffffff;
            border-radius: 18px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalFadeIn 0.2s ease-out;
        }

        @keyframes modalFadeIn {
            from { transform: scale(0.96); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .form-row {
            margin-bottom: 12px;
        }

        .form-row label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 4px;
        }

        .form-row input, .form-row select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1.5px solid #cbd5e1;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-row input:focus, .form-row select:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* PRINT STYLES - PIXEL PERFECT A4 WITH GUARANTEED SIDE AND BOTTOM MARGINS */
        @media print {
            @page {
                size: A4 portrait;
                margin: 8mm 10mm 10mm 10mm;
            }

            html, body {
                background: #ffffff !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
                font-family: 'Battambang', sans-serif !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                width: 100% !important;
            }

            .action-toolbar,
            .info-pill-bar,
            .settings-modal-backdrop,
            .no-print,
            .btn {
                display: none !important;
            }

            .a4-page-wrapper {
                padding: 0 !important;
                margin: 0 auto !important;
                width: 100% !important;
                display: block !important;
            }

            .a4-sheet {
                width: 100% !important;
                min-width: 0 !important;
                max-width: 100% !important;
                min-height: auto !important;
                height: auto !important;
                margin: 0 auto !important;
                padding: 0 4mm 8mm 4mm !important;
                box-sizing: border-box !important;
                box-shadow: none !important;
                border: none !important;
                page-break-after: auto !important;
                break-after: auto !important;
            }

            .exam-table-wrapper {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 auto !important;
                overflow: visible !important;
            }

            table.exam-table {
                width: 100% !important;
                min-width: 0 !important;
                max-width: 100% !important;
                border: 1.5px solid #000000 !important;
                border-collapse: collapse !important;
                page-break-inside: auto !important;
                margin: 0 auto !important;
            }

            table.exam-table thead {
                display: table-header-group !important;
            }

            table.exam-table tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            table.exam-table th,
            table.exam-table td {
                border: 1px solid #000000 !important;
                color: #000000 !important;
                min-width: 0 !important;
                padding: 2.5px 2px !important;
            }

            .editable-cell {
                background: transparent !important;
            }

            .signature-section {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                margin-bottom: 8mm !important;
            }
        }
    </style>
</head>
<body>

    <!-- Sticky Top Action Toolbar -->
    <header class="action-toolbar no-print">
        <div class="toolbar-left">
            <button type="button" class="toolbar-btn" onclick="window.location.href='index.html'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                ត្រឡប់ទៅទំព័រដើម
            </button>
            <div id="global-class-selector"></div>
            <button type="button" class="toolbar-btn toolbar-btn-amber" onclick="openSettingsModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

            <button type="button" class="toolbar-btn" id="btn-toggle-numerals" onclick="toggleNumerals()">

            </button>
            <button type="button" class="toolbar-btn" onclick="reloadDefaultSampleData()" style="color: #0284c7;" title="ទាញយកទិន្នន័យគំរូ និងលេខប័ណ្ណក្រីក្រឡើងវិញ">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>

        </div>

        <div class="toolbar-right">

                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                បន្ថែមជួរសិស្ស

                បោះពុម្ព (Print)
            </button>
        </div>
    </header>

    <!-- Quick Info Pill Bar -->
    <div class="info-pill-bar no-print">
        <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
            <div class="stat-pill">
                <span>🎓 សិស្សសរុប ៖</span>
                <span class="stat-badge" id="info-total-students">0 នាក់</span>
            </div>
            <div class="stat-pill">
                <span>👩 សិស្សស្រី ៖</span>
                <span class="stat-badge" id="info-female-students" style="color: #e11d48;">0 នាក់</span>
            </div>
            <div class="stat-pill">
                <span>👨 សិស្សប្រុស ៖</span>
                <span class="stat-badge" id="info-male-students" style="color: #0284c7;">0 នាក់</span>
            </div>
        </div>
        <div style="font-size: 0.82rem; color: #64748b;">
            💡 ព័ត៌មានក្នុងតារាងអាចចុចកែប្រែដោយផ្ទាល់បាន (Click cell to edit)
        </div>
    </div>

    <!-- Main A4 Viewport Container -->
    <main class="a4-page-wrapper" id="a4-pages-container">
        <!-- Rendered by JavaScript -->
    </main>

    <!-- Settings Modal -->
    <div class="settings-modal-backdrop" id="settings-modal" onclick="if(event.target===this) closeSettingsModal()">
        <div class="settings-modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 16px;">
                <h3 style="margin: 0; color: #1e293b; font-size: 1.15rem; display: flex; align-items: center; gap: 8px;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>កំណត់ព័ត៌មានឯកសារបញ្ជីប្រឡង</span>
                </h3>
                <button type="button" onclick="closeSettingsModal()" style="background: none; border: none; font-size: 1.5rem; color: #64748b; cursor: pointer;">&times;</button>
            </div>

            <form id="settings-form" onsubmit="saveSettings(event)">
                <div class="form-grid-2">
                    <div class="form-row">
                        <label>ការិយាល័យអប់រំ យុវជន និងកីឡា</label>
                        <input type="text" id="cfg-office-name" placeholder="ឧ. ការិយាល័យអប់រំយុវជននិងកីឡា ស្រុកសន្ទុក" required>
                    </div>
                    <div class="form-row">
                        <label>ឈ្មោះសាលាបឋមសិក្សា</label>
                        <input type="text" id="cfg-school-name" placeholder="ឧ. សាលាបឋមសិក្សា ផ្លុង" required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-row">
                        <label>ឈ្មោះអនុវិទ្យាល័យដែលត្រូវប្រឡងចូល</label>
                        <input type="text" id="cfg-target-school" placeholder="ឧ. អនុវិទ្យាល័យ ទីពោ" required>
                    </div>
                    <div class="form-row">
                        <label>ឆ្នាំសិក្សា</label>
                        <input type="text" id="cfg-academic-year" placeholder="ឧ. ២០២៥-២០២៦" required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-row">
                        <label>ខេត្ត (សម្រាប់មន្ទីរអប់រំ)</label>
                        <input type="text" id="cfg-province-name" placeholder="ឧ. កំពង់ធំ" required>
                    </div>
                    <div class="form-row">
                        <label>ស្រុក (សម្រាប់ស្រុកអប់រំ)</label>
                        <input type="text" id="cfg-district-name" placeholder="ឧ. សន្ទុក" required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-row">
                        <label>កាលបរិច្ឆេទថ្ងៃប្រឡង/ចេញបញ្ជី</label>
                        <input type="date" id="cfg-exam-date" required onchange="updateLunarPreviewFromDate(this.value)">
                    </div>
                    <div class="form-row">
                        <label>កាលបរិច្ឆេទចន្ទគតិ (ស្វ័យប្រវត្តិ)</label>
                        <input type="text" id="cfg-lunar-text" placeholder="កាលបរិច្ឆេទចន្ទគតិ...">
                    </div>
                </div>

                <div class="form-row">
                    <label>ឈ្មោះខ្លីរបស់សាលាសម្រាប់ដាក់ក្នុងតារាងក្រឡា «មកពីសាលា»</label>
                    <input type="text" id="cfg-short-school-name" placeholder="ឧ. បឋម ផ្លុង" required>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px; border-top: 1px solid #f1f5f9; padding-top: 14px;">
                    <button type="button" class="toolbar-btn" onclick="resetSettingsToDefault()">កំណត់ឡើងវិញ (Reset)</button>
                    <div style="display: flex; gap: 10px;">
                        <button type="button" class="toolbar-btn" onclick="closeSettingsModal()">បោះបង់</button>
                        <button type="submit" class="toolbar-btn toolbar-btn-primary">រក្សាទុក</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Page Script -->
    <script src="grade6-exam-list.js"></script>
</body>
</html>
