<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូលប្រើប្រព័ន្ធតាមថ្នាក់ - Student Grade System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Kantumruy+Pro:wght@300;400;500;600;700&family=Battambang:wght@400;700;900&family=Moul&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Battambang', 'Khmer OS Battambang', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #064e3b 100%);
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.25), transparent 70%);
            top: 5%;
            left: 10%;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(50px);
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.22), transparent 70%);
            bottom: 5%;
            right: 10%;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(60px);
        }

        .login-wrapper {
            width: 100%;
            max-width: 960px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.3);
            overflow: hidden;
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.5s ease-out;
            display: flex;
            flex-direction: column;
        }

        .login-top-header {
            padding: 2rem 2rem 1.2rem 2rem;
            text-align: center;
            background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
            border-bottom: 1px solid #e2e8f0;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
            margin-bottom: 0.8rem;
        }

        .login-top-header h1 {
            font-family: 'Moul', cursive;
            font-size: 1.3rem;
            color: #0f172a;
            margin-bottom: 0.3rem;
            line-height: 1.4;
        }

        .login-top-header p {
            font-size: 0.88rem;
            color: #64748b;
            font-weight: 500;
        }

        .login-body {
            padding: 1.8rem 2rem;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 820px) {
            .login-body {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        /* Class Selector Grid */
        .classes-section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .classes-section-title h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .class-cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        @media (max-width: 520px) {
            .class-cards-grid {
                grid-template-columns: 1fr;
            }
        }

        .class-card-item {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .class-card-item:hover {
            transform: translateY(-2px);
            border-color: #10b981;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.12);
        }

        .class-card-item.active {
            border-color: #059669;
            background: #ecfdf5;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .class-card-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 700;
            font-size: 0.88rem;
            color: #065f46;
        }

        .class-card-teacher {
            font-size: 0.84rem;
            font-weight: 600;
            color: #1e293b;
        }

        .class-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.76rem;
            color: #64748b;
            margin-top: 2px;
        }

        .class-card-room {
            background: #e2e8f0;
            color: #334155;
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 600;
        }

        .admin-card-item {
            grid-column: 1 / -1;
            background: #fefce8;
            border-color: #fde047;
        }

        .admin-card-item:hover {
            border-color: #ca8a04;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(202, 138, 4, 0.15);
        }

        .admin-card-item.active {
            border-color: #ca8a04;
            background: #fef9c3;
            box-shadow: 0 0 0 3px rgba(202, 138, 4, 0.2);
        }

        /* Form Side */
        .login-form-panel {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            padding: 1.6rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 16px rgba(0,0,0,0.03);
        }

        .selected-account-banner {
            background: #f0fdf4;
            border: 1.5px solid #bbf7d0;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .banner-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #10b981;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .banner-info h4 {
            margin: 0;
            font-size: 0.9rem;
            color: #065f46;
            font-weight: 700;
        }

        .banner-info p {
            margin: 2px 0 0 0;
            font-size: 0.78rem;
            color: #047857;
        }

        .form-group {
            margin-bottom: 1.1rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.86rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.4rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            color: #94a3b8;
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .login-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.6rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 0.92rem;
            font-family: inherit;
            color: #1e293b;
            background: #f8fafc;
            transition: all 0.2s ease;
            outline: none;
        }

        .login-input:focus {
            background: #ffffff;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: #334155;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            font-size: 0.82rem;
            color: #64748b;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            user-select: none;
        }

        .remember-label input {
            accent-color: #10b981;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 18px -4px rgba(16, 185, 129, 0.4);
            transition: all 0.22s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -4px rgba(16, 185, 129, 0.5);
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .alert-box {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.84rem;
            margin-bottom: 1rem;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>

    <script src="auth.js"></script>
    <script src="classManager.js"></script>
</head>
<body>

    <div class="login-wrapper">
        <!-- Top Header -->
        <div class="login-top-header">
            <div class="login-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
            </div>
            <h1>ប្រព័ន្ធគ្រប់គ្រងទិន្នន័យសិស្ស និងពិន្ទុ</h1>
            <p>ចូលប្រើប្រាស់តាមគណនីគ្រូបន្ទុកថ្នាក់នីមួយៗ ឬគណនីអ្នកគ្រប់គ្រងទូទៅ</p>
        </div>

        <!-- Body with 2-Column Responsive Layout -->
        <div class="login-body">
            
            <!-- Left Column: Class Selector Grid -->
            <div class="classes-selector-column">
                <div class="classes-section-title">
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        <span>ជ្រើសរើសថ្នាក់ដើម្បីចូល (Select Class)</span>
                    </h3>
                    <span style="font-size: 0.78rem; color: #64748b;">ចុចលើថ្នាក់ដើម្បីបំពេញ</span>
                </div>

                <div class="class-cards-grid" id="class-cards-container">
                    <!-- Populated dynamically by JS -->
                </div>
            </div>

            <!-- Right Column: Login Form -->
            <div class="login-form-column">
                <div class="login-form-panel">
                    
                    <!-- Selected Account Banner -->
                    <div class="selected-account-banner" id="selected-account-banner">
                        <div class="banner-icon" id="banner-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                        </div>
                        <div class="banner-info">
                            <h4 id="banner-title">លោកគ្រូ សុខ សុផល</h4>
                            <p id="banner-subtitle">ថ្នាក់ទី ១ ក • បន្ទប់លេខ ០១</p>
                        </div>
                    </div>

                    <!-- Alert message box -->
                    <div id="alert-msg" class="alert-box"></div>

                    <!-- Login Form -->
                    <form id="login-form" onsubmit="handleLoginSubmit(event)">
                        <div class="form-group">
                            <label for="username">ឈ្មោះអ្នកប្រើប្រាស់ (Username)</label>
                            <div class="input-wrapper">
                                <div class="input-icon">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                        <circle cx="12" cy="7" r="4"></circle>
                                    </svg>
                                </div>
                                <input type="text" id="username" class="login-input" placeholder="បញ្ចូល Username" required autocomplete="username">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">លេខសម្ងាត់ (Password)</label>
                            <div class="input-wrapper">
                                <div class="input-icon">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg>
                                </div>
                                <input type="password" id="password" class="login-input" placeholder="បញ្ចូល Password" required autocomplete="current-password">
                                <button type="button" class="password-toggle" onclick="togglePasswordVisibility()" title="បង្ហាញ/លាក់ លេខសម្ងាត់">
                                    <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="remember-label">
                                <input type="checkbox" id="remember-me" checked>
                                <span>ចងចាំការចូលប្រើ (Remember Me)</span>
                            </label>
                        </div>

                        <button type="submit" class="btn-login" id="btn-submit">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                                <polyline points="10 17 15 12 10 7"></polyline>
                                <line x1="15" y1="12" x2="3" y2="12"></line>
                            </svg>
                            <span>ចូលប្រើប្រព័ន្ធ (Login)</span>
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>

    <script>
        let allAccounts = [];
        let selectedAccountIndex = 0;

                document.addEventListener('DOMContentLoaded', () => {
            // Always display class cards so user can log in with any account
            loadClassCards();
        });

                function loadClassCards() {
            allAccounts = window.auth ? window.auth.getUsers() : [];
            const container = document.getElementById('class-cards-container');
            if (!container) return;

            let html = '';
            allAccounts.forEach((u, idx) => {
                const isAdmin = u.role === 'admin';
                const cardClass = isAdmin ? 'class-card-item admin-card-item' : 'class-card-item';
                const badgeIcon = isAdmin ? '👑' : '🏫';
                const badgeColor = isAdmin ? '#b45309' : '#047857';

                let displayClassName = u.className;
                if (!displayClassName || displayClassName.startsWith('class_')) {
                    if (isAdmin) {
                        displayClassName = 'គ្រប់ថ្នាក់ទាំងអស់';
                    } else if (u.assignedClassId === 'default' || u.assignedClassId === 'class_g5_k') {
                        displayClassName = 'ថ្នាក់ទី ៥ ក';
                    } else if (window.classManager && typeof window.classManager.getClasses === 'function') {
                        const foundCls = window.classManager.getClasses().find(c => c.id === u.assignedClassId);
                        if (foundCls && foundCls.name) displayClassName = foundCls.name;
                    }
                }
                if (!displayClassName) displayClassName = (isAdmin ? 'គ្រប់ថ្នាក់ទាំងអស់' : 'ថ្នាក់ទូទៅ');

                html += `
                    <div class="${cardClass} ${idx === selectedAccountIndex ? 'active' : ''}" onclick="selectAccountCard(${idx})" id="card-acc-${idx}">
                        <div class="class-card-badge" style="color: ${badgeColor};">
                            <span>${badgeIcon}</span>
                            <span>${displayClassName}</span>
                        </div>
                        <div class="class-card-teacher">${u.fullName}</div>
                        <div class="class-card-meta">
                            <span class="class-card-room">${u.roomNumber || 'បន្ទប់ទូទៅ'}</span>
                            <span style="font-family: monospace; font-size: 0.75rem; color: #64748b;">User: ${u.username}</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            // Pre-select last remembered user or first account
            const lastUser = localStorage.getItem('lastRememberedUsername');
            let initialIdx = 0;
            if (lastUser) {
                const foundIdx = allAccounts.findIndex(a => a.username.toLowerCase() === lastUser.toLowerCase());
                if (foundIdx !== -1) initialIdx = foundIdx;
            }
            if (allAccounts.length > 0) {
                selectAccountCard(initialIdx);
            }
        }

        function selectAccountCard(index) {
            selectedAccountIndex = index;
            const u = allAccounts[index];
            if (!u) return;

            // Highlight active card
            document.querySelectorAll('.class-card-item').forEach((card, idx) => {
                card.classList.toggle('active', idx === index);
            });

            // Update banner
            const bannerTitle = document.getElementById('banner-title');
            const bannerSubtitle = document.getElementById('banner-subtitle');
            const bannerIcon = document.getElementById('banner-icon');

            if (u.role === 'admin') {
                bannerTitle.textContent = `${u.fullName} (Admin)`;
                bannerSubtitle.textContent = `ការិយាល័យនាយក • សិទ្ធិគ្រប់គ្រងទូទៅ`;
                bannerIcon.style.background = '#eab308';
                bannerIcon.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
            } else {
                bannerTitle.textContent = u.fullName;
                bannerSubtitle.textContent = `${u.className || 'ថ្នាក់បន្ទុក'} • ${u.roomNumber || 'បន្ទប់លេខ'}`;
                bannerIcon.style.background = '#10b981';
                bannerIcon.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>`;
            }

            // Fill Form Inputs
            document.getElementById('username').value = u.username;
            document.getElementById('password').value = u.password || '123';
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            } else {
                pwdInput.type = 'password';
                eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            }
        }

        function showAlert(msg, type = 'error') {
            const alertBox = document.getElementById('alert-msg');
            alertBox.textContent = msg;
            alertBox.className = `alert-box alert-${type}`;
            alertBox.style.display = 'block';
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const remember = document.getElementById('remember-me').checked;

            if (!username || !password) {
                showAlert('សូមបញ្ចូលឈ្មោះអ្នកប្រើប្រាស់ និងលេខសម្ងាត់!', 'error');
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = `<span>កំពុងចូលប្រើប្រព័ន្ធ...</span>`;

            setTimeout(() => {
                const res = window.auth.login(username, password, remember);
                if (res.success) {
                    const u = res.user;
                    const welcomeMsg = u.role === 'admin' 
                        ? `🎉 ស្វាគមន៍លោកនាយក (${u.fullName}) មកកាន់ប្រព័ន្ធ!`
                        : `🎉 ស្វាគមន៍ ${u.fullName} (${u.className || 'ថ្នាក់បង្រៀន'}) មកកាន់ប្រព័ន្ធ!`;
                    
                    showAlert(welcomeMsg, 'success');

                    setTimeout(() => {
                        let redirect = sessionStorage.getItem('redirectAfterLogin') || 'index.html';
                        sessionStorage.removeItem('redirectAfterLogin');
                        if (!redirect || redirect.includes('login')) {
                            redirect = 'index.html';
                        }
                        window.location.href = redirect;
                    }, 450);
                } else {
                    showAlert(res.message || 'ឈ្មោះអ្នកប្រើប្រាស់ ឬលេខសម្ងាត់មិនត្រឹមត្រូវ!', 'error');
                    btn.disabled = false;
                    btn.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                        <span>ចូលប្រើប្រព័ន្ធ (Login)</span>
                    `;
                }
            }, 250);
        }
    </script>
</body>
</html>
